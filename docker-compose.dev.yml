# Lightweight dev stack: SQLite in web container, sync OCR (no Celery required)
services:
  web:
    build:
      context: .
      target: web
    ports:
      - "8000:8000"
    env_file: .env
    environment:
      DEBUG: "True"
      DATABASE_URL: sqlite
      CELERY_BROKER_URL: redis://redis:6379/0
    volumes:
      - .:/app
      - media_data:/app/media
    command: python manage.py runserver 0.0.0.0:8000
    depends_on:
      - redis

  redis:
    image: redis:7-alpine

  celery:
    build:
      context: .
      target: celery
    env_file: .env
    environment:
      DATABASE_URL: sqlite
      CELERY_BROKER_URL: redis://redis:6379/0
    volumes:
      - .:/app
      - media_data:/app/media
    depends_on:
      - redis

volumes:
  media_data:
