{# public_share_url, host_code, show_share_intro #}
<section class="card mt-6 border-emerald-500/30 bg-emerald-500/5"
         x-data="{
           copied: false,
           shareUrl: '{{ public_share_url|escapejs }}',
           async copyLink() {
             await navigator.clipboard.writeText(this.shareUrl);
             this.copied = true;
             setTimeout(() => { this.copied = false; }, 2000);
           },
           async shareLink() {
             if (navigator.share) {
               try {
                 await navigator.share({
                   title: 'Join my parlay on ParlaySplit',
                   url: this.shareUrl,
                 });
                 return;
               } catch (e) {
                 if (e && e.name === 'AbortError') return;
               }
             }
             await this.copyLink();
           }
         }">
  {% if show_share_intro %}
  <p class="text-sm font-semibold text-emerald-400 mb-1">Parlay created</p>
  <p class="text-xs text-slate-500 mb-4">Share the link with friends. Keep your host code for yourself.</p>
  {% else %}
  <h2 class="font-semibold text-sm text-slate-300 mb-3">Share</h2>
  {% endif %}

  <div class="space-y-4">
    <div>
      <p class="label mb-1">Share link <span class="text-slate-600 font-normal normal-case">(friends join here)</span></p>
      <div class="flex gap-2">
        <input type="text"
               readonly
               class="input-field text-sm flex-1 min-w-0"
               :value="shareUrl"
               aria-label="Public parlay link">
        <button type="button"
                class="btn-primary shrink-0 px-4 py-2 text-sm"
                @click="shareLink()">
          <span x-text="copied ? 'Copied!' : 'Share'"></span>
        </button>
      </div>
    </div>

    <div class="rounded-xl border border-slate-700 bg-slate-900/80 px-4 py-4 text-center">
      <p class="text-xs text-slate-500 uppercase tracking-wide mb-1">Your host code</p>
      <p class="text-3xl font-extrabold tracking-[0.35em] text-emerald-400 font-mono">{{ host_code }}</p>
      <p class="text-xs text-slate-500 mt-2">Save this code to find your parlay later.</p>
    </div>
  </div>
</section>
